# ============================================================
# 行业热点事件 (market_context)
# ============================================================
# 用途: 补充数据源可能遗漏的重大行业事件，确保分析师不会忽略关键信息
# 格式:
#   global: [全局性事件]
#   <industry_key>: [该行业的重大事件]
#   <symbol>: [该个股的特定事件]
# 建议: 定期更新此部分，添加近1-3个月的重大行业新闻
market_context:
  global:
    - "2025年全球AI资本开支持续超预期，四大云厂商合计Capex预计超3000亿美元"
    - "美联储2025年降息节奏放缓，市场预期2026年上半年可能再降息1-2次"
    - "中美科技竞争持续，AI芯片出口管制进一步收紧"

  hk_internet:
    - "阿里巴巴2025年Q3起大举进军外卖市场(饿了么升级+补贴战)，直接挑战美团核心外卖业务，市场份额争夺加剧"
    - "抖音本地生活2025年GMV持续高增长，到店业务对美团形成实质竞争压力"
    - "拼多多Temu海外增长放缓，国内主站增速回归常态"
    - "港股互联网板块2024-2025年经历估值修复，南向资金持续流入"
    - "中国消费复苏节奏偏慢，消费降级趋势延续"

  ai_chips:
