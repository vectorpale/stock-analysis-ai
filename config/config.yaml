# ============================================================
# 个股深度分析系统 - 多Agent辩论模型 配置文件
# ============================================================

# LLM 服务商配置
# 默认使用通义千问 (Qwen)，只需设置 DASHSCOPE_API_KEY 即可
# 也支持: Anthropic Claude, DeepSeek, GPT, Ollama 等
llm_provider:
  provider: "openai_compatible"   # "openai_compatible" (默认) | "anthropic"
  # api_key: ""                   # 留空则从环境变量读取 (推荐)
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"  # 通义千问
  # 其他 Base URL 示例:
  #   DeepSeek:  https://api.deepseek.com
  #   Ollama:    http://localhost:11434/v1
  #   OpenAI:    留空或删除 base_url 行

# AI 模型配置 (通义千问默认值)
# 留空或注释掉则使用内置默认: qwen-max / qwen-plus / qwen-turbo
models:
  # cio: "qwen-max"               # CIO 最终决策 (最强推理)
  # analyst: "qwen-plus"          # 分析师辩论 (平衡性能与成本)
  # data_extract: "qwen-turbo"    # 数据提取 (快速)
  # Anthropic 模型 (切换到 Claude 时使用):
  #   cio: "claude-opus-4-20250514"
  #   analyst: "claude-sonnet-4-20250514"
  #   data_extract: "claude-haiku-4-5-20251001"

# 辩论参数
debate:
  max_rounds: 3                    # 最大辩论轮数
  convergence_threshold: 0.80      # 收敛阈值 (0-1)
  min_confidence_buy: 65           # 最低买入信心阈值
  risk_veto_enabled: true          # 风控官一票否决权

# 分析师权重
agent_weights:
  fundamental_bull: 1.0
  fundamental_bear: 1.0
  industry_analyst: 1.2            # 行业分析师权重略高
  financial_analyst: 1.2           # 财务分析师权重略高
  macro_strategist: 0.9
  risk_manager: 1.1

# 数据获取配置
# 美股推荐设置 FMP_API_KEY (免费250次/天): https://site.financialmodelingprep.com/developer/docs
data:
  price_lookback: "1y"             # 价格数据回溯周期
  cache_hours: 6                   # 缓存时效(小时)
  max_news_items: 20               # 最大新闻条数
  max_competitors: 5               # 最多分析竞品数量

