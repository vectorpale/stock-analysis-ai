# ============================================================
# 个股深度分析系统 - 多Agent辩论模型 配置文件
# ============================================================

# AI 模型配置
models:
  cio: "claude-opus-4-20250514"          # CIO 最终决策用最强推理模型
  analyst: "claude-sonnet-4-20250514"    # 分析师辩论用
  data_extract: "claude-haiku-4-5-20251001"  # 数据提取/摘要用快速模型

# 辩论参数
debate:
  max_rounds: 3                    # 最大辩论轮数
  convergence_threshold: 0.80      # 收敛阈值 (0-1)
  min_confidence_buy: 65           # 最低买入信心阈值
  risk_veto_enabled: true          # 风控官一票否决权

# 分析师权重
agent_weights:
  fundamental_bull: 1.0
  fundamental_bear: 1.0
  industry_analyst: 1.2            # 行业分析师权重略高
  financial_analyst: 1.2           # 财务分析师权重略高
  macro_strategist: 0.9
  risk_manager: 1.1

# 数据获取配置
data:
  price_lookback: "1y"             # 价格数据回溯周期
  cache_hours: 6                   # 缓存时效(小时)
  max_news_items: 20               # 最大新闻条数
  max_competitors: 5               # 最多分析竞品数量

# 行业分类与竞品映射
# 格式: 行业名 -> [核心个股列表]
