# 估值参考基准
valuation_benchmarks:
  growth_tech:
    pe_range: [20, 60]
    ps_range: [5, 20]
    peg_range: [0.5, 2.0]
  value:
    pe_range: [8, 20]
    pb_range: [0.8, 3.0]
    dividend_yield_min: 0.02
  biotech:
    ps_range: [3, 30]
    ev_ebitda_range: [10, 40]
