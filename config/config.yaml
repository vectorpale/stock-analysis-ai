    - "蔚来、小鹏、理想分化加剧，价格战压力持续"

  ev_auto:
    - "特斯拉2025年销量增速放缓，市场等待低价车型和Robotaxi进展"
    - "中国新能源车渗透率突破50%，竞争格局剧变"

  3690.HK:
    - "阿里巴巴2025年投入数十亿补贴重启外卖大战(饿了么+支付宝入口)，美团外卖份额面临5年来最大挑战"
